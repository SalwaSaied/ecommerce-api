<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Stripe Test Payment</title>
  <script src="https://js.stripe.com/v3/"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
  <h1>Test Stripe Payment</h1>

  <div>
    <label>Enter your JWT token:</label><br>
    <input type="text" id="token" placeholder="eyJhbGciOi..." size="60" />
  </div>
  <br>

  <!-- Stripe Card Element -->
  <div id="card-element"></div>
  <br>

  <button id="pay-btn">Pay Now</button>
  <div id="payment-result"></div>

  <script>
    // Your publishable key (already in your message)
    const stripe = Stripe("pk_test_51TZep4J5pfNk8Lyf4FEvsiR22z6wptUEjODBGaPsB9fJ0NNoJuYSzMn5pu8wlm3zAaDyBOwPcabEIwcaqWHNVAkA00bkoY0g8E");
    const elements = stripe.elements();
    const cardElement = elements.create("card", {
      style: { base: { fontSize: "16px" } }
    });
    cardElement.mount("#card-element");

    document.getElementById("pay-btn").addEventListener("click", async () => {
      const token = document.getElementById("token").value.trim();
      if (!token) {
        alert("Please enter your JWT token");
        return;
      }

      try {
        // 1. Create the order and get clientSecret
        const { data } = await axios.post(
          "/orders",  // same origin – no CORS issues
          {
            paymentMethod: "stripe",
            shippingAddress: {
              fullName: "Test User",
              phone: "01000000000",
              country: "Egypt",
              city: "Cairo",
              address: "123 Test St",
              postalCode: "12345"
            }
          },
          {
            headers: { Authorization: `Bearer ${token}` }
          }
        );

        const clientSecret = data.clientSecret;
        console.log("ClientSecret received:", clientSecret);

        // 2. Confirm the card payment
        const { paymentIntent, error } = await stripe.confirmCardPayment(
          clientSecret,
          {
            payment_method: {
              card: cardElement,
              billing_details: {
                name: "Test User"
              }
            }
          }
        );

        if (error) {
          document.getElementById("payment-result").innerText =
            `Payment failed: ${error.message}`;
        } else if (paymentIntent.status === "succeeded") {
          document.getElementById("payment-result").innerText =
            "✅ Payment successful!";
        }
      } catch (err) {
        console.error(err);
        document.getElementById("payment-result").innerText =
          `Error: ${err.response?.data?.message || err.message}`;
      }
    });
  </script>
</body>
</html>
